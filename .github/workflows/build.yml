name: Build SmoothPacing Mod

on:
  push:
    branches: [ "**" ] # Включает авто-сборку при пуше в ВООБЩЕ ЛЮБУЮ ветку
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # Добавляет кнопку ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmoothPacing-Fabric-1.21.11
          path: build/libs/*.jar
          
